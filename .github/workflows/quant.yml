name: Quant model
# Monthly: walk-forward evaluation + retrain on all prices, then commit the model and the
# honest report (docs/quant_report.md). The daily pipeline reads models/quant_model.json.
on:
  schedule:
    - cron: "41 6 1 * *"     # 1st of every month, 06:41 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-model
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Train and evaluate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m arena.quant.train
      - name: Commit model and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/quant_model.json docs/quant_report.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Monthly quant model retrain"
          git pull --rebase origin main
          git push origin HEAD:main
