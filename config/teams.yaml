# Phase 2 starts with one team; Phase 5 adds the other two.
teams:
  - name: Momentum
    holding_style: short          # short | long
    news_weight: 0.3              # 0 = price trend only, 1 = news only
    min_source_trust: 0.5
    min_conviction: 0.6
    max_candidates_per_day: 3
    models: {analyst: analyst, bull: bull, bear: bear, judge: judge}
    shared_lessons: false
